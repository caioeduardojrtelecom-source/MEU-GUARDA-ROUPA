<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Meu Guarda Roupa</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <!-- Configurações PWA / Ícone do iPhone -->
    <link rel="manifest" href="manifest.json">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Meu Guarda Roupa">
    <!-- Substitua o link abaixo pela mesma foto/ícone escolhida -->
    <link rel="apple-touch-icon" href="URL_DA_SUA_FOTO_AQUI.png">
</head>
<body class="bg-neutral-100 text-neutral-900 font-sans pb-28">

    <!-- Cabeçalho Elegante -->
    <header class="bg-neutral-900 text-white px-4 py-5 shadow-sm sticky top-0 z-50 backdrop-blur-md bg-neutral-900/90 border-b border-neutral-800">
        <div class="max-w-md mx-auto flex justify-between items-center">
            <h1 class="text-lg font-semibold tracking-wide flex items-center">
                <i class="fa-solid fa-shirt mr-2.5 text-neutral-400"></i> Meu Guarda Roupa
            </h1>
            <span class="text-[10px] uppercase tracking-widest bg-neutral-800 text-neutral-300 px-2.5 py-1 rounded-full font-medium">Moda & IA</span>
        </div>
    </header>

    <!-- Conteúdo Principal -->
    <main class="max-w-md mx-auto p-4 space-y-5">

        <!-- Abas de Navegação Estilo Minimalista -->
        <div class="flex bg-white rounded-2xl shadow-xs p-1.5 border border-neutral-200/80">
            <button onclick="switchTab('closet')" id="btn-closet" class="flex-1 py-2.5 text-center text-xs font-semibold rounded-xl bg-neutral-900 text-white shadow-xs transition-all">Guarda-Roupa</button>
            <button onclick="switchTab('ai')" id="btn-ai" class="flex-1 py-2.5 text-center text-xs font-semibold rounded-xl text-neutral-500 hover:text-neutral-900 transition-all">Looks IA</button>
        </div>

        <!-- Seção: Closet -->
        <section id="tab-closet" class="space-y-5">
            <!-- Card Adicionar Peça -->
            <div class="bg-white p-5 rounded-3xl shadow-xs border border-neutral-200/80">
                <h2 class="text-sm font-bold uppercase tracking-wider text-neutral-400 mb-4">Adicionar Nova Peça</h2>
                <form id="add-item-form" class="space-y-4" onsubmit="addItem(event)">
                    
                    <!-- Seleção de Foto -->
                    <div>
                        <label class="block text-xs font-medium text-neutral-600 mb-2">Origem da Imagem</label>
                        <div class="flex gap-2 mb-3">
                            <button type="button" onclick="setPhotoSource('file')" id="btn-source-file" class="flex-1 py-2 text-xs font-medium rounded-xl bg-neutral-900 text-white transition-all">📁 Arquivo</button>
                            <button type="button" onclick="setPhotoSource('cam')" id="btn-source-cam" class="flex-1 py-2 text-xs font-medium rounded-xl bg-neutral-100 text-neutral-600 transition-all">📷 Câmera / PC</button>
                        </div>

                        <!-- Opção 1: Arquivo -->
                        <div id="container-file">
                            <input type="file" id="item-image-file" accept="image/*" class="w-full text-xs text-neutral-500 file:mr-4 file:py-2.5 file:px-4 file:rounded-xl file:border-0 file:text-xs file:font-semibold file:bg-neutral-100 file:text-neutral-700 hover:file:bg-neutral-200 cursor-pointer">
                        </div>

                        <!-- Opção 2: Câmera -->
                        <div id="container-cam" class="hidden space-y-2.5">
                            <div class="relative bg-neutral-900 rounded-2xl overflow-hidden aspect-video flex items-center justify-center">
                                <video id="webcam" autoplay playsinline class="w-full h-full object-cover"></video>
                                <canvas id="canvas" class="hidden"></canvas>
                            </div>
                            <div class="flex gap-2">
                                <button type="button" onclick="startCamera()" class="flex-1 bg-neutral-200 text-neutral-800 py-2 rounded-xl text-xs font-semibold hover:bg-neutral-300 transition">Ligar Câmera</button>
                                <button type="button" onclick="takeSnapshot()" class="flex-1 bg-neutral-900 text-white py-2 rounded-xl text-xs font-semibold hover:bg-neutral-800 transition">Capturar Foto</button>
                            </div>
                        </div>

                        <!-- Pré-visualização -->
                        <div id="preview-container" class="hidden mt-3 text-center bg-neutral-50 p-3 rounded-2xl border border-dashed border-neutral-300">
                            <img id="image-preview" class="w-20 h-20 object-cover rounded-xl mx-auto shadow-xs">
                            <span class="text-[10px] text-emerald-600 font-semibold block mt-1.5">✓ Foto pronta para salvar</span>
                        </div>
                    </div>

                    <div>
                        <label class="block text-xs font-medium text-neutral-600 mb-1.5">Nome / Descrição da Peça</label>
                        <input type="text" id="item-name" placeholder="Ex: Blazer Alfaiataria Preto" required class="w-full px-3.5 py-2.5 bg-neutral-50 border border-neutral-200 rounded-xl focus:outline-none focus:border-neutral-900 text-xs transition">
                    </div>

                    <div>
                        <label class="block text-xs font-medium text-neutral-600 mb-1.5">Categoria</label>
                        <select id="item-category" class="w-full px-3.5 py-2.5 bg-neutral-50 border border-neutral-200 rounded-xl focus:outline-none focus:border-neutral-900 text-xs transition">
                            <option value="topo">Parte de Cima (Camisas, Casacos)</option>
                            <option value="baixo">Parte de Baixo (Calças, Bermudas)</option>
                            <option value="calcado">Calçados</option>
                            <option value="acessorio">Acessórios</option>
                        </select>
                    </div>

                    <button type="submit" class="w-full bg-neutral-900 text-white py-3 rounded-xl font-medium hover:bg-neutral-800 transition text-xs shadow-xs">Salvar Peça no Closet</button>
                </form>
            </div>

            <!-- Grade de Peças -->
            <div>
                <div class="flex justify-between items-center mb-3">
                    <h2 class="text-sm font-bold uppercase tracking-wider text-neutral-400">Meu Guarda-Roupa</h2>
                    <span class="text-xs bg-white px-2.5 py-1 rounded-full border border-neutral-200 font-semibold text-neutral-600"><span id="item-count">0</span> itens</span>
                </div>
                <div id="closet-grid" class="grid grid-cols-2 gap-3">
                    <!-- Itens inseridos via JavaScript -->
                </div>
            </div>
        </section>

        <!-- Seção: Looks IA -->
        <section id="tab-ai" class="hidden space-y-5">
            <div class="bg-gradient-to-br from-neutral-900 to-neutral-800 text-white p-6 rounded-3xl shadow-md space-y-4">
                <div>
                    <h2 class="text-base font-bold flex items-center"><i class="fa-solid fa-wand-magic-sparkles mr-2 text-neutral-400"></i> Estilista IA</h2>
                    <p class="text-xs text-neutral-400 mt-1">A IA vai cruzar as suas peças cadastradas para criar o look ideal para a sua ocasião.</p>
                </div>
                
                <div>
                    <label class="block text-xs font-medium text-neutral-300 mb-1.5">Ocasião do Look</label>
                    <select id="ai-occasion" class="w-full px-3.5 py-2.5 bg-neutral-800/80 border border-neutral-700 rounded-xl text-white focus:outline-none text-xs">
                        <option value="casual" class="text-neutral-900">Casual / Dia a dia</option>
                        <option value="trabalho" class="text-neutral-900">Trabalho / Formal</option>
                        <option value="noite" class="text-neutral-900">Passeio Noturno</option>
                        <option value="frio" class="text-neutral-900">Dias Frios</option>
                    </select>
                </div>

                <button onclick="generateAILook()" class="w-full bg-white text-neutral-900 py-3 rounded-xl font-bold hover:bg-neutral-100 transition text-xs shadow-xs">Gerar Look Inteligente</button>
            </div>

            <!-- Resultado do Look -->
            <div id="ai-result" class="hidden bg-white p-5 rounded-3xl shadow-xs border border-neutral-200/80 space-y-4">
                <h3 class="text-xs font-bold uppercase tracking-wider text-neutral-400 border-b border-neutral-100 pb-2.5">Look Recomendado pela IA</h3>
                <div id="look-items-container" class="grid grid-cols-2 gap-3">
                    <!-- Itens gerados -->
                </div>
                <p id="ai-tip" class="text-xs text-neutral-600 bg-neutral-50 p-3.5 rounded-2xl italic border border-neutral-100 leading-relaxed"></p>
            </div>
        </section>

    </main>

    <!-- Script JavaScript -->
    <script>
        let closet = JSON.parse(localStorage.getItem('my_closet')) || [];
        let capturedImageData = null;
        let mediaStream = null;

        function switchTab(tab) {
            const closetSec = document.getElementById('tab-closet');
            const aiSec = document.getElementById('tab-ai');
            const btnCloset = document.getElementById('btn-closet');
            const btnAi = document.getElementById('btn-ai');

            if (tab === 'closet') {
                closetSec.classList.remove('hidden');
                aiSec.classList.add('hidden');
                btnCloset.className = "flex-1 py-2.5 text-center text-xs font-semibold rounded-xl bg-neutral-900 text-white shadow-xs transition-all";
                btnAi.className = "flex-1 py-2.5 text-center text-xs font-semibold rounded-xl text-neutral-500 hover:text-neutral-900 transition-all";
            } else {
                closetSec.classList.add('hidden');
                aiSec.classList.remove('hidden');
                btnAi.className = "flex-1 py-2.5 text-center text-xs font-semibold rounded-xl bg-neutral-900 text-white shadow-xs transition-all";
                btnCloset.className = "flex-1 py-2.5 text-center text-xs font-semibold rounded-xl text-neutral-500 hover:text-neutral-900 transition-all";
                stopCamera();
            }
        }

        function setPhotoSource(source) {
            const containerFile = document.getElementById('container-file');
            const containerCam = document.getElementById('container-cam');
            const btnFile = document.getElementById('btn-source-file');
            const btnCam = document.getElementById('btn-source-cam');

            if (source === 'file') {
                containerFile.classList.remove('hidden');
                containerCam.classList.add('hidden');
                btnFile.className = "flex-1 py-2 text-xs font-medium rounded-xl bg-neutral-900 text-white transition-all";
                btnCam.className = "flex-1 py-2 text-xs font-medium rounded-xl bg-neutral-100 text-neutral-600 transition-all";
                stopCamera();
            } else {
                containerFile.classList.add('hidden');
                containerCam.classList.remove('hidden');
                btnCam.className = "flex-1 py-2 text-xs font-medium rounded-xl bg-neutral-900 text-white transition-all";
                btnFile.className = "flex-1 py-2 text-xs font-medium rounded-xl bg-neutral-100 text-neutral-600 transition-all";
                startCamera();
            }
        }

        async function startCamera() {
            try {
                mediaStream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: 'environment' }, audio: false });
                document.getElementById('webcam').srcObject = mediaStream;
            } catch (err) {
                alert('Não foi possível acessar a câmera. Verifique as permissões.');
            }
        }

        function stopCamera() {
            if (mediaStream) {
                mediaStream.getTracks().forEach(track => track.stop());
                mediaStream = null;
            }
        }

        function takeSnapshot() {
            const videoElement = document.getElementById('webcam');
            const canvas = document.getElementById('canvas');
            if (!mediaStream) {
                alert('Ligue a câmera primeiro!');
                return;
            }
            canvas.width = videoElement.videoWidth || 640;
            canvas.height = videoElement.videoHeight || 480;
            const ctx = canvas.getContext('2d');
            ctx.drawImage(videoElement, 0, 0, canvas.width, canvas.height);
            
            capturedImageData = canvas.toDataURL('image/png');
            document.getElementById('image-preview').src = capturedImageData;
            document.getElementById('preview-container').classList.remove('hidden');
            stopCamera();
        }

        function addItem(e) {
            e.preventDefault();
            const name = document.getElementById('item-name').value;
            const category = document.getElementById('item-category').value;
            const imageFileinput = document.getElementById('item-image-file');

            if (capturedImageData) {
                saveNewItem(name, category, capturedImageData);
            } else if (imageFileinput.files[0]) {
                const reader = new FileReader();
                reader.onload = function(event) {
                    saveNewItem(name, category, event.target.result);
                };
                reader.readAsDataURL(imageFileinput.files[0]);
            } else {
                alert('Por favor, adicione uma foto por arquivo ou webcam.');
            }
        }

        function saveNewItem(name, category, imageBase64) {
            closet.push({ id: Date.now(), name, category, image: imageBase64 });
            localStorage.setItem('my_closet', JSON.stringify(closet));
            document.getElementById('add-item-form').reset();
            capturedImageData = null;
            document.getElementById('preview-container').classList.add('hidden');
            renderCloset();
            alert('Peça salva no seu guarda-roupa!');
        }

        function deleteItem(id) {
            if (confirm('Deseja excluir esta peça?')) {
                closet = closet.filter(item => item.id !== id);
                localStorage.setItem('my_closet', JSON.stringify(closet));
                renderCloset();
            }
        }

        function renderCloset() {
            const grid = document.getElementById('closet-grid');
            document.getElementById('item-count').innerText = closet.length;
            
            if (closet.length === 0) {
                grid.innerHTML = `<p class="col-span-2 text-center text-neutral-400 py-10 text-xs">Seu guarda-roupa está vazio.</p>`;
                return;
            }

            grid.innerHTML = closet.map(item => `
                <div class="bg-white rounded-2xl shadow-xs border border-neutral-200/80 overflow-hidden flex flex-col">
                    <img src="${item.image}" alt="${item.name}" class="w-full h-32 object-cover bg-neutral-100">
                    <div class="p-3 flex-1 flex flex-col justify-between">
                        <div>
                            <span class="text-[9px] uppercase font-bold tracking-wider text-neutral-500 bg-neutral-100 px-2 py-0.5 rounded-md">${item.category}</span>
                            <h4 class="text-xs font-semibold text-neutral-800 mt-1.5 truncate">${item.name}</h4>
                        </div>
                        <button onclick="deleteItem(${item.id})" class="mt-3 text-red-500 hover:text-red-700 text-[11px] font-medium flex items-center justify-center py-1 bg-red-50 rounded-lg transition"><i class="fa-solid fa-trash mr-1"></i> Excluir</button>
                    </div>
                </div>
            `).join('');
        }

        function generateAILook() {
            const occasion = document.getElementById('ai-occasion').value;
            const tops = closet.filter(i => i.category === 'topo');
            const bottoms = closet.filter(i => i.category === 'baixo');
            const shoes = closet.filter(i => i.category === 'calcado');

            if (tops.length === 0 || bottoms.length === 0) {
                alert('Cadastre pelo menos uma peça na "Parte de Cima" e uma na "Parte de Baixo" para a IA montar o look.');
                return;
            }

            const randomTop = tops[Math.floor(Math.random() * tops.length)];
            const randomBottom = bottoms[Math.floor(Math.random() * bottoms.length)];
            const randomShoe = shoes.length > 0 ? shoes[Math.floor(Math.random() * shoes.length)] : null;

            const resultContainer = document.getElementById('ai-result');
            const itemsContainer = document.getElementById('look-items-container');
            const tipContainer = document.getElementById('ai-tip');

            resultContainer.classList.remove('hidden');

            let html = `
                <div class="text-center">
                    <img src="${randomTop.image}" class="w-full h-24 object-cover rounded-xl mb-1 shadow-xs">
                    <span class="text-[11px] font-medium text-neutral-700 truncate block">${randomTop.name}</span>
                </div>
                <div class="text-center">
                    <img src="${randomBottom.image}" class="w-full h-24 object-cover rounded-xl mb-1 shadow-xs">
                    <span class="text-[11px] font-medium text-neutral-700 truncate block">${randomBottom.name}</span>
                </div>
            `;

            if (randomShoe) {
                html += `
                    <div class="col-span-2 text-center mt-1">
                        <img src="${randomShoe.image}" class="w-full h-20 object-cover rounded-xl mb-1 shadow-xs">
                        <span class="text-[11px] font-medium text-neutral-700 block">Calçado: ${randomShoe.name}</span>
                    </div>
                `;
            }

            itemsContainer.innerHTML = html;
            tipContainer.innerText = `💡 Combinação ideal selecionada pela IA para "${occasion}". Perfeita harmonia de cores e estilo para hoje!`;
        }

        renderCloset();
    </script>
</body>
</html>
