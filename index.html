<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Meu Guarda-Roupa IA</title>
    <!-- Tailwind CSS para um design moderno -->
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="bg-gray-50 text-gray-800 font-sans pb-24">

    <!-- Cabeçalho -->
    <header class="bg-indigo-600 text-white p-4 shadow-md sticky top-0 z-50">
        <div class="max-w-md mx-auto flex justify-between items-center">
            <h1 class="text-xl font-bold"><i class="fa-solid fa-shirt mr-2"></i> Meu Guarda-Roupa IA</h1>
            <span class="text-xs bg-indigo-500 px-2 py-1 rounded-full">v1.0 Mobile</span>
        </div>
    </header>

    <!-- Conteúdo Principal -->
    <main class="max-w-md mx-auto p-4">

        <!-- Abas de Navegação -->
        <div class="flex bg-white rounded-xl shadow-sm p-1 mb-6 border border-gray-100">
            <button onclick="switchTab('closet')" id="btn-closet" class="flex-1 py-2 text-center font-medium rounded-lg bg-indigo-50 text-indigo-600 transition">Guarda-Roupa</button>
            <button onclick="switchTab('ai')" id="btn-ai" class="flex-1 py-2 text-center font-medium rounded-lg text-gray-500 transition">Looks IA</button>
        </div>

        <!-- Seção: Closet -->
        <section id="tab-closet" class="space-y-6">
            <!-- Botão Adicionar Peça -->
            <div class="bg-white p-4 rounded-2xl shadow-sm border border-gray-100">
                <h2 class="text-lg font-semibold mb-3 text-gray-700">Adicionar Nova Peça</h2>
                <form id="add-item-form" class="space-y-3" onsubmit="addItem(event)">
                    <div>
                        <label class="block text-xs font-medium text-gray-500 mb-1">Foto da Peça</label>
                        <input type="file" id="item-image" accept="image/*" required class="w-full text-sm text-gray-500 file:mr-4 file:py-2 file:px-4 file:rounded-xl file:border-0 file:text-sm file:font-semibold file:bg-indigo-50 file:text-indigo-700 hover:file:bg-indigo-100 cursor-pointer">
                    </div>
                    <div>
                        <label class="block text-xs font-medium text-gray-500 mb-1">Nome / Descrição</label>
                        <input type="text" id="item-name" placeholder="Ex: Camisa Polo Azul" required class="w-full px-3 py-2 border border-gray-200 rounded-xl focus:outline-none focus:ring-2 focus:ring-indigo-500 text-sm">
                    </div>
                    <div>
                        <label class="block text-xs font-medium text-gray-500 mb-1">Categoria</label>
                        <select id="item-category" class="w-full px-3 py-2 border border-gray-200 rounded-xl focus:outline-none focus:ring-2 focus:ring-indigo-500 text-sm bg-white">
                            <option value="topo">Parte de Cima (Camisas, Casacos)</option>
                            <option value="baixo">Parte de Baixo (Calças, Bermudas)</option>
                            <option value="calcado">Calçados</option>
                            <option value="acessorio">Acessórios</option>
                        </select>
                    </div>
                    <button type="submit" class="w-full bg-indigo-600 text-white py-2.5 rounded-xl font-medium shadow-sm hover:bg-indigo-700 transition text-sm">Salvar no Closet</button>
                </form>
            </div>

            <!-- Grade de Peças -->
            <div>
                <h2 class="text-lg font-semibold mb-3 text-gray-700">Meu Closet (<span id="item-count">0</span>)</h2>
                <div id="closet-grid" class="grid grid-cols-2 gap-3">
                    <!-- Itens inseridos via JavaScript -->
                </div>
            </div>
        </section>

        <!-- Seção: Looks IA -->
        <section id="tab-ai" class="hidden space-y-6">
            <div class="bg-gradient-to-br from-indigo-500 to-purple-600 text-white p-5 rounded-2xl shadow-md">
                <h2 class="text-xl font-bold mb-2"><i class="fa-solid fa-wand-magic-sparkles mr-2"></i> Estilista Virtual</h2>
                <p class="text-sm text-indigo-100 mb-4">Deixe nossa IA analisar suas peças e montar uma combinação perfeita para hoje.</p>
                
                <div>
                    <label class="block text-xs font-medium text-indigo-200 mb-1">Ocasião</label>
                    <select id="ai-occasion" class="w-full px-3 py-2 bg-white/10 border border-white/20 rounded-xl text-white focus:outline-none text-sm mb-4">
                        <option value="casual" class="text-gray-800">Casual / Dia a dia</option>
                        <option value="trabalho" class="text-gray-800">Trabalho / Formal</option>
                        <option value="noite" class="text-gray-800">Passeio Noturno</option>
                        <option value="frio" class="text-gray-800">Dias Frios</option>
                    </select>
                </div>

                <button onclick="generateAILook()" class="w-full bg-white text-indigo-600 py-3 rounded-xl font-bold shadow-sm hover:bg-indigo-50 transition text-sm">Gerar Look com IA</button>
            </div>

            <!-- Resultado do Look -->
            <div id="ai-result" class="hidden bg-white p-4 rounded-2xl shadow-sm border border-gray-100 space-y-4">
                <h3 class="font-semibold text-gray-700 border-b pb-2">Sugestão de Look Escolhida:</h3>
                <div id="look-items-container" class="grid grid-cols-2 gap-3">
                    <!-- Itens do look gerado -->
                </div>
                <p id="ai-tip" class="text-xs text-gray-500 bg-indigo-50 p-3 rounded-xl italic"></p>
            </div>
        </section>

    </main>

    <!-- Script JavaScript do App -->
    <script>
        let closet = JSON.parse(localStorage.getItem('my_closet')) || [];

        function switchTab(tab) {
            const closetSec = document.getElementById('tab-closet');
            const aiSec = document.getElementById('tab-ai');
            const btnCloset = document.getElementById('btn-closet');
            const btnAi = document.getElementById('btn-ai');

            if (tab === 'closet') {
                closetSec.classList.remove('hidden');
                aiSec.classList.add('hidden');
                btnCloset.className = "flex-1 py-2 text-center font-medium rounded-lg bg-indigo-50 text-indigo-600 transition";
                btnAi.className = "flex-1 py-2 text-center font-medium rounded-lg text-gray-500 transition";
            } else {
                closetSec.classList.add('hidden');
                aiSec.classList.remove('hidden');
                btnAi.className = "flex-1 py-2 text-center font-medium rounded-lg bg-indigo-50 text-indigo-600 transition";
                btnCloset.className = "flex-1 py-2 text-center font-medium rounded-lg text-gray-500 transition";
            }
        }

        function addItem(e) {
            e.preventDefault();
            const name = document.getElementById('item-name').value;
            const category = document.getElementById('item-category').value;
            const imageInput = document.getElementById('item-image');

            const reader = new FileReader();
            reader.onload = function(event) {
                const newItem = {
                    id: Date.now(),
                    name,
                    category,
                    image: event.target.result
                };
                closet.push(newItem);
                localStorage.setItem('my_closet', JSON.stringify(closet));
                
                document.getElementById('add-item-form').reset();
                renderCloset();
                alert('Peça adicionada ao guarda-roupa com sucesso!');
            };
            
            if (imageInput.files[0]) {
                reader.readAsDataURL(imageInput.files[0]);
            }
        }

        function deleteItem(id) {
            if (confirm('Deseja excluir esta peça?')) {
                closet = closet.filter(item => item.id !== id);
                localStorage.setItem('my_closet', JSON.stringify(closet));
                renderCloset();
            }
        }

        function renderCloset() {
            const grid = document.getElementById('closet-grid');
            document.getElementById('item-count').innerText = closet.length;
            
            if (closet.length === 0) {
                grid.innerHTML = `<p class="col-span-2 text-center text-gray-400 py-8 text-sm">Seu guarda-roupa está vazio. Adicione sua primeira peça acima!</p>`;
                return;
            }

            grid.innerHTML = closet.map(item => `
                <div class="bg-white rounded-2xl shadow-sm border border-gray-100 overflow-hidden relative flex flex-col">
                    <img src="${item.image}" alt="${item.name}" class="w-full h-36 object-cover bg-gray-100">
                    <div class="p-3 flex-1 flex flex-col justify-between">
                        <div>
                            <span class="text-[10px] uppercase font-bold tracking-wider text-indigo-600 bg-indigo-50 px-2 py-0.5 rounded-md">${item.category}</span>
                            <h4 class="text-sm font-semibold text-gray-800 mt-1 truncate">${item.name}</h4>
                        </div>
                        <button onclick="deleteItem(${item.id})" class="mt-2 text-red-500 hover:text-red-700 text-xs flex items-center justify-center py-1 bg-red-50 rounded-lg"><i class="fa-solid fa-trash mr-1"></i> Excluir</button>
                    </div>
                </div>
            `).join('');
        }

        function generateAILook() {
            const occasion = document.getElementById('ai-occasion').value;
            const tops = closet.filter(i => i.category === 'topo');
            const bottoms = closet.filter(i => i.category === 'baixo');
            const shoes = closet.filter(i => i.category === 'calcado');

            if (tops.length === 0 || bottoms.length === 0) {
                alert('Você precisa cadastrar pelo menos uma peça na "Parte de Cima" e uma na "Parte de Baixo" para a IA montar um look!');
                return;
            }

            // Sorteio inteligente simulado da IA
            const randomTop = tops[Math.floor(Math.random() * tops.length)];
            const randomBottom = bottoms[Math.floor(Math.random() * bottoms.length)];
            const randomShoe = shoes.length > 0 ? shoes[Math.floor(Math.random() * shoes.length)] : null;

            const resultContainer = document.getElementById('ai-result');
            const itemsContainer = document.getElementById('look-items-container');
            const tipContainer = document.getElementById('ai-tip');

            resultContainer.classList.remove('hidden');

            let html = `
                <div class="text-center">
                    <img src="${randomTop.image}" class="w-full h-28 object-cover rounded-xl mb-1">
                    <span class="text-xs font-medium text-gray-600">${randomTop.name}</span>
                </div>
                <div class="text-center">
                    <img src="${randomBottom.image}" class="w-full h-28 object-cover rounded-xl mb-1">
                    <span class="text-xs font-medium text-gray-600">${randomBottom.name}</span>
                </div>
            `;

            if (randomShoe) {
                html += `
                    <div class="col-span-2 text-center mt-2">
                        <img src="${randomShoe.image}" class="w-full h-24 object-cover rounded-xl mb-1">
                        <span class="text-xs font-medium text-gray-600">Calçado: ${randomShoe.name}</span>
                    </div>
                `;
            }

            itemsContainer.innerHTML = html;
            tipContainer.innerText = `💡 Dica da IA para a ocasião "${occasion}": Esta combinação traz um contraste moderno e confortável. Ideal para você se destacar com estilo!`;
        }

        // Inicializar o app na primeira carga
        renderCloset();
    </script>
</body>
</html>
